name: CI

on:
  push:
    # Her iki ad da listeli: depo su an "master" kullaniyor. Sadece "main"
    # yazilsaydi varsayilan dala push'ta CI HIC calismazdi ve bu ancak ilk
    # PR'da fark edilirdi -- merge sonrasi regresyonlar sessizce gecerdi.
    branches: [main, master]
  pull_request:

# En az yetki ilkesi. Belirtilmezse GITHUB_TOKEN depo/organizasyon
# varsayilanini alir; eski depolarda bu read-write olabilir.
permissions:
  contents: read

# Ayni dal icin yeni push gelirse eski kosuyu iptal et (CI dakikasi israf etme).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci: package-lock.json'a birebir sadik, tekrarlanabilir kurulum.
      # "npm install" kullanmiyoruz -- lock dosyasini sessizce degistirebilir.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (coverage esikleriyle)
        run: npm run test:ci

      - name: Coverage ozetini is akisina yaz
        if: always()
        run: |
          test -f coverage/coverage-summary.json || exit 0
          node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage raporunu sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # SDK/paket surum uyumsuzluklarini erken yakalar (app.json <-> package.json).
      # devDependency olarak sabitlendi: "npx expo-doctor" her koşuda npm'den
      # en son surumu cekerdi (tedarik zinciri riski + tekrarlanamaz kosu).
      - run: npm run doctor
